    <animate attributeName="cy" values="100; 115; 100" dur="12s" repeatCount="indefinite"/>
  </circle>
  <line x1="600" y1="40" x2="670" y2="90" stroke="#666" stroke-width="1">
    <animate attributeName="opacity" values="0.02; 0.06; 0.02" dur="7s" repeatCount="indefinite"/>
  </line>
  <line x1="640" y1="20" x2="640" y2="120" stroke="#666" stroke-width="1">
    <animate attributeName="opacity" values="0.02; 0.08; 0.02" dur="9s" repeatCount="indefinite"/>
  </line>
</svg>
