<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" height="100%" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <rect width="100%" height="100%" fill="none" />
  <g>
    <circle cx="640" cy="60" r="40" fill="#5BC0EB" opacity="0.15"/>
    <animateTransform attributeName="transform" attributeType="XML"
      type="rotate" from="0 635 65" to="360 635 65" dur="25s" repeatCount="indefinite"/>
  </g>
  <rect x="600" y="40" width="60" height="60" rx="8" fill="#9BC53D" opacity="0.07">
    <animateTransform attributeName="transform"
      type="translate" values="0,0; 0,15; 0,0" dur="8s" repeatCount="indefinite"/>
  </rect>
  <circle cx="610" cy="100" r="25" opacity="0.12">
